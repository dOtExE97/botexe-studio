# Windows-Build & Release.
# - Push auf main / manuell: baut die Setup-.exe als Artefakt (zum Testen).
# - Push eines Versions-Tags `v*` (z.B. v0.2.0): VERÖFFENTLICHT ein GitHub-Release
#   mit Squirrel-Feed (.exe + .nupkg + RELEASES) für das Auto-Update.
#   ACHTUNG: KEINE Delta-Pakete! update.electronjs.org macht nur aus der ERSTEN
#   Zeile der RELEASES-Datei eine absolute Adresse und hängt sie ans neueste
#   Release. Enthält die Datei mehr als die aktuelle Version (so wie mit Squirrels
#   `remoteReleases`), zeigt diese Zeile auf eine Datei, die dort nicht liegt →
#   der Update-Helfer stirbt mit „Command failed: 4294967295" und NIEMAND kann
#   mehr updaten (passiert in v0.39.0, zurückgenommen in v0.39.1).
name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    # Bei Tags NICHT bauen — dann übernimmt der publish-Job.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Make (Squirrel-Setup)
        run: npm run make --workspace apps/desktop
      - name: Upload Setup-Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: botexe-studio-windows-setup
          path: |
            apps/desktop/out/make/squirrel.windows/x64/*.exe
            apps/desktop/out/make/squirrel.windows/x64/*.nupkg
            apps/desktop/out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error
          retention-days: 14

  publish-windows:
    # Nur bei Versions-Tag: Release veröffentlichen (Update-Feed).
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    permissions:
      contents: write # Release anlegen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Publish (GitHub Release + Update-Feed)
        run: npm run publish --workspace apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
