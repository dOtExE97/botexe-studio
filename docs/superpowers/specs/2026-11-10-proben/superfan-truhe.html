// Partikel
const P = [];
function stepP() {
  for (const p of P) { p.life++; p.vx *= p.drag ?? 1; p.vy = p.vy * (p.drag ?? 1) + (p.grav ?? 0); p.x += p.vx; p.y += p.vy; if (p.vr) p.rot += p.vr; if (p.vph) p.ph += p.vph; }

}

}
